<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Часы смен">
<title>Часы смен</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../theme.css?v=1">
<link rel="stylesheet" href="hours.css?v=6">
<script src="../core.js?v=2026-11-15.8" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" defer></script>
<script src="hours.js?v=6" defer></script>
</head>
<body class="hours">
<div id="bg"><div class="lay"><i class="l l1"></i><i class="l l2"></i><i class="l l3"></i><i class="l l4"></i></div></div>
<div id="app">
  <main class="screen" id="scrHist">
    <div class="hours-content">
      <header class="big"><h1>Часы смен</h1><span id="sync-state" class="sync-state" role="status" hidden></span></header>
      <form id="connect" class="card connect" hidden>
        <p class="lead" id="install-hint">На iPhone откройте эту страницу в Safari и выберите «Поделиться» → «На экран Домой». Затем откройте приложение с иконки и введите код.</p>
        <label for="code">Код приглашения</label>
        <input id="code" type="text" required autocapitalize="off" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn">Подключить</button>
      </form>
      <section id="billboard" class="card hours-billboard sheen" aria-label="Табло смен" hidden>
        <div class="billboard-light" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="billboard-scenes"></div>
        <div class="billboard-controls"><div class="billboard-dots" role="group" aria-label="Сцены табло"></div>
          <button class="billboard-toggle" type="button" aria-label="Остановить анимацию" aria-pressed="false">Ⅱ</button></div>
      </section>
      <div id="controls" hidden>
        <div class="segbig" role="group" aria-label="Смены">
          <button type="button" data-view="pending" aria-pressed="true">К расчёту</button>
          <button type="button" data-view="archive" aria-pressed="false">Архив</button>
          <i></i>
        </div>
        <button id="refresh" class="pill" type="button" aria-label="Обновить">↻</button>
      </div>
      <p id="status" class="lead" role="status">Загрузка…</p>
      <section id="live" aria-label="Текущие смены"></section>
      <section id="history" aria-label="История смен"></section>
    </div>
  </main>
</div>
<div id="scrim" aria-hidden="true"></div>
<section id="shift-detail" class="sheet" role="dialog" aria-modal="true" aria-labelledby="shift-title" inert>
  <div class="grab" aria-hidden="true"></div>
  <div class="levels"><div class="level">
    <div class="hours-content"><header class="lh"><h2 id="shift-title"></h2><button class="x" type="button" aria-label="Закрыть">✕</button></header>
    <div id="shift-body"></div></div>
  </div></div>
</section>
</body>
</html>
